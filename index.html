<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Imsakiyah Pekanbaru 1447 H - Fix</title>


    <script src="https://unpkg.com/adhan@4.4.3/lib/bundles/adhan.umd.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0fdf4;
            color: #1f2937;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background: white;
            max-width: 900px;
            width: 100%;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #047857;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 8px;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background-color: #059669;
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        tr:nth-child(even) {
            background-color: #f9fafb;
        }

        tr:hover {
            background-color: #ecfdf5;
        }

        strong {
            color: #047857;
        }

        .highlight {
            font-weight: bold;
            color: #d97706;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Jadwal Imsakiyah Ramadhan 1447 H</h1>
        <div class="subtitle">
            <strong>Wilayah:</strong> Pekanbaru, Riau (0.5071° N, 101.4478° E)<br>
            <strong>Metode:</strong> Kemenag RI (Subuh 20°, Isya 18°) + Ihtiyat 2 Menit<br>
            <strong>Mulai:</strong> Kamis, 19 Februari 2026
        </div>

        <table id="jadwalTable">
            <thead>
                <tr>
                    <th>Hari / Tanggal</th>
                    <th>Imsak</th>
                    <th>Subuh</th>
                    <th>Zuhur</th>
                    <th>Ashar</th>
                    <th>Maghrib</th>
                    <th>Isya</th>
                </tr>
            </thead>
            <tbody id="scheduleBody">
            </tbody>
        </table>
    </div>

    <script>
        // Cek ketersediaan library agar tidak error diam-diam
        if (typeof adhan === 'undefined') {
            document.body.innerHTML = '<h2 style="text-align:center; color:red; margin-top:50px;">Gagal memuat library Adhan.js. Pastikan Anda terhubung ke internet.</h2>';
        } else {
            // --- 1. KONFIGURASI LOKASI (PEKANBARU) ---
            const latitude = 0.5071;
            const longitude = 101.4478;
            const coordinates = new adhan.Coordinates(latitude, longitude);

            // --- 2. KONFIGURASI TANGGAL ---
            const startDate = new Date(2026, 1, 19); // 19 Februari 2026

            // --- 3. KONFIGURASI METODE KEMENAG RI ---
            const params = adhan.CalculationMethod.Singapore();
            params.fajrAngle = 20;
            params.ishaAngle = 18;
            params.madhab = adhan.Madhab.Shafi;

            // Ihtiyat +2 menit
            params.adjustments = { fajr: 2, dhuhr: 2, asr: 2, maghrib: 2, isha: 2 };

            // --- 4. FUNGSI FORMAT WAKTU (FIX) ---
            function formatTime(dateObj) {
                // Menggunakan pemformat waktu bawaan browser untuk zona WIB
                return new Intl.DateTimeFormat('id-ID', {
                    timeZone: 'Asia/Jakarta',
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                }).format(dateObj);
            }

            // --- 5. GENERATE JADWAL ---
            const tbody = document.getElementById('scheduleBody');
            const daysName = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const monthName = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

            for (let i = 0; i < 30; i++) {
                const currentDate = new Date(startDate);
                currentDate.setDate(startDate.getDate() + i);

                const prayerTimes = new adhan.PrayerTimes(coordinates, currentDate, params);

                // Hitung Imsak (Subuh - 10 menit)
                const imsakTime = new Date(prayerTimes.fajr);
                imsakTime.setMinutes(imsakTime.getMinutes() - 10);

                // Format Tanggal
                const dayStr = daysName[currentDate.getDay()];
                const dateStr = `${currentDate.getDate()} ${monthName[currentDate.getMonth()]} ${currentDate.getFullYear()}`;

                // Render Baris
                const row = `
                <tr>
                    <td style="text-align:left; font-weight:500;">${dayStr}, ${dateStr}</td>
                    <td class="highlight">${formatTime(imsakTime)}</td>
                    <td>${formatTime(prayerTimes.fajr)}</td>
                    <td>${formatTime(prayerTimes.dhuhr)}</td>
                    <td>${formatTime(prayerTimes.asr)}</td>
                    <td><strong>${formatTime(prayerTimes.maghrib)}</strong></td>
                    <td>${formatTime(prayerTimes.isha)}</td>
                </tr>
            `;
                tbody.innerHTML += row;
            }
        }
    </script>

</body>

</html>
