<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Imsakiyah Otomatis 1447 H</title>
    
    <script src="https://unpkg.com/adhan@4.4.3/lib/bundles/adhan.umd.js"></script>
    
    <style>
        :root {
            --primary-green: #065f46;
            --light-green: #ecfdf5;
            --accent-orange: #d97706;
            --text-main: #1f2937;
            --white: #ffffff;
        }

        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background-color: #f3f4f6; 
            color: var(--text-main); 
            margin: 0;
            padding: 10px;
            display: flex; 
            justify-content: center; 
        }

        .container { 
            background: var(--white); 
            max-width: 900px; 
            width: 100%; 
            padding: 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            margin-top: 20px;
        }

        h1 { 
            text-align: center; 
            color: var(--primary-green); 
            margin-bottom: 5px;
            font-size: 1.5rem;
        }

        .subtitle { 
            text-align: center; 
            color: #6b7280; 
            margin-bottom: 25px; 
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            min-width: 600px;
        }

        th { 
            background-color: var(--primary-green); 
            color: var(--white); 
            font-weight: 600; 
            text-transform: uppercase; 
            font-size: 0.75rem; 
            letter-spacing: 0.05em;
            padding: 15px;
            position: sticky;
            top: 0;
        }

        td { 
            padding: 14px; 
            text-align: center; 
            border-bottom: 1px solid #f3f4f6;
            font-size: 0.9rem;
        }

        tr:nth-child(even) { background-color: #fafafa; }
        tr:hover { background-color: var(--light-green); }

        .date-col { text-align: left; font-weight: 600; color: #374151; }
        .highlight { font-weight: bold; color: var(--accent-orange); background: #fffbeb; }
        .maghrib { font-weight: 800; color: var(--primary-green); }

        #status-message {
            text-align: center;
            padding: 10px;
            margin-bottom: 10px;
            font-style: italic;
            color: var(--accent-orange);
        }
    </style>
</head>
<body>

<div class="container">
    <div id="status-message">Sedang mendeteksi lokasi kamu...</div>
    
    <div id="content" style="display:none;">
        <h1>Jadwal Imsakiyah Ramadhan 1447 H</h1>
        <div class="subtitle">
            <strong id="location-name">Lokasi Tidak Terdeteksi</strong><br>
            Metode Kemenag RI • Awal Ramadhan: Kamis, 19 Februari 2026
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Hari / Tanggal</th>
                        <th>Imsak</th>
                        <th>Subuh</th>
                        <th>Zuhur</th>
                        <th>Ashar</th>
                        <th>Maghrib</th>
                        <th>Isya</th>
                    </tr>
                </thead>
                <tbody id="scheduleBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Konfigurasi Default (Jika lokasi ditolak)
    const DEFAULT_COORDS = { lat: -6.2000, lng: 106.8167 }; // Jakarta
    const START_DATE = new Date(2026, 1, 19); // 19 Feb 2026

    function init() {
        if (typeof adhan === 'undefined') {
            document.getElementById('status-message').innerText = "Error: Pustaka Adhan tidak termuat.";
            return;
        }

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(onPositionFound, onPositionError);
        } else {
            onPositionError();
        }
    }

    function onPositionFound(position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        
        updateLocationName(lat, lng);
        generateSchedule(lat, lng);
    }

    function onPositionError() {
        alert("Akses lokasi ditolak atau tidak tersedia. Menggunakan lokasi default (Jakarta).");
        document.getElementById('location-name').innerText = "Jakarta (Default)";
        generateSchedule(DEFAULT_COORDS.lat, DEFAULT_COORDS.lng);
    }

    // Fungsi mengambil nama kota (Reverse Geocoding)
    function updateLocationName(lat, lng) {
        const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`;
        
        fetch(url)
            .then(response => response.json())
            .then(data => {
                const city = data.address.city || data.address.town || data.address.village || data.address.county || "Lokasi Anda";
                document.getElementById('location-name').innerText = `Wilayah: ${city} (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
            })
            .catch(err => {
                console.error(err);
                document.getElementById('location-name').innerText = `Wilayah: (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
            });
    }

    function generateSchedule(lat, lng) {
        document.getElementById('status-message').style.display = 'none';
        document.getElementById('content').style.display = 'block';

        const coords = new adhan.Coordinates(lat, lng);
        const params = adhan.CalculationMethod.Singapore();
        params.fajrAngle = 20;
        params.ishaAngle = 18;
        params.adjustments = { fajr: 2, dhuhr: 2, asr: 2, maghrib: 2, isha: 2 };

        const tbody = document.getElementById('scheduleBody');
        tbody.innerHTML = ''; // Bersihkan isi tabel sebelumnya
        
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
        const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

        function formatTime(dateObj) {
            return new Intl.DateTimeFormat('id-ID', {
                hour: '2-digit', minute: '2-digit', hour12: false
            }).format(dateObj);
        }

        for (let i = 0; i < 30; i++) {
            let cur = new Date(START_DATE);
            cur.setDate(START_DATE.getDate() + i);

            const p = new adhan.PrayerTimes(coords, cur, params);
            const imsak = new Date(p.fajr);
            imsak.setMinutes(imsak.getMinutes() - 10);

            const row = `
                <tr>
                    <td class="date-col">${days[cur.getDay()]}, ${cur.getDate()} ${months[cur.getMonth()]}</td>
                    <td class="highlight">${formatTime(imsak)}</td>
                    <td>${formatTime(p.fajr)}</td>
                    <td>${formatTime(p.dhuhr)}</td>
                    <td>${formatTime(p.asr)}</td>
                    <td class="maghrib">${formatTime(p.maghrib)}</td>
                    <td>${formatTime(p.isha)}</td>
                </tr>
            `;
            tbody.innerHTML += row;
        }
    }

    // Jalankan saat halaman dimuat
    init();
</script>

</body>
</html>
