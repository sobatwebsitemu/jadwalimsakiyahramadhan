<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Puasa Ramadhan 1447 H / 2026 M</title>
    <style>
        :root {
            --primary-color: #059669; /* Warna hijau modern */
            --bg-color: #f3f4f6;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 900px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .header-title {
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .selector-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (max-width: 600px) {
            .selector-group {
                grid-template-columns: 1fr; /* Tumpuk ke bawah di HP */
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        select {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            cursor: pointer;
            background-color: white;
        }

        select:disabled {
            background-color: #f9fafb;
            cursor: not-allowed;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        th, td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        .message {
            text-align: center;
            padding: 30px;
            color: #6b7280;
            font-style: italic;
        }

        .loading {
            color: var(--primary-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2 class="header-title">Jadwal Imsakiyah Ramadhan 1447 H</h2>
        <p class="subtitle">Estimasi: 19 Februari - 18 Maret 2026</p>

        <div class="selector-group">
            <div class="input-group">
                <label for="provinsiSelect"><strong>1. Pilih Provinsi:</strong></label>
                <select id="provinsiSelect">
                    <option value="">Memuat provinsi...</option>
                </select>
            </div>
            
            <div class="input-group">
                <label for="kotaSelect"><strong>2. Pilih Kota/Kabupaten:</strong></label>
                <select id="kotaSelect" disabled>
                    <option value="">-- Pilih Provinsi Dahulu --</option>
                </select>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Tanggal Masehi</th>
                        <th>Imsak</th>
                        <th>Subuh</th>
                        <th>Zuhur</th>
                        <th>Ashar</th>
                        <th>Maghrib</th>
                        <th>Isya</th>
                    </tr>
                </thead>
                <tbody id="scheduleBody">
                    <tr>
                        <td colspan="7" class="message">Silakan pilih provinsi dan kota untuk melihat jadwal.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const provinsiSelect = document.getElementById('provinsiSelect');
        const kotaSelect = document.getElementById('kotaSelect');
        const scheduleBody = document.getElementById('scheduleBody');

        // 1. Mengambil data Provinsi dari API Wilayah Indonesia
        async function fetchProvinsi() {
            try {
                const response = await fetch('https://emsifa.github.io/api-wilayah-indonesia/api/provinces.json');
                const provinces = await response.json();
                
                provinsiSelect.innerHTML = '<option value="">-- Pilih Provinsi --</option>';
                provinces.forEach(prov => {
                    provinsiSelect.innerHTML += `<option value="${prov.id}">${prov.name}</option>`;
                });
            } catch (error) {
                provinsiSelect.innerHTML = '<option value="">Gagal memuat provinsi</option>';
            }
        }

        // 2. Mengambil data Kota berdasarkan ID Provinsi
        async function fetchKota(provinceId) {
            kotaSelect.innerHTML = '<option value="">Memuat kota...</option>';
            kotaSelect.disabled = true;

            try {
                const response = await fetch(`https://emsifa.github.io/api-wilayah-indonesia/api/regencies/${provinceId}.json`);
                const regencies = await response.json();
                
                kotaSelect.innerHTML = '<option value="">-- Pilih Kota/Kabupaten --</option>';
                regencies.forEach(kota => {
                    kotaSelect.innerHTML += `<option value="${kota.name}">${kota.name}</option>`;
                });
                kotaSelect.disabled = false;
            } catch (error) {
                kotaSelect.innerHTML = '<option value="">Gagal memuat kota</option>';
            }
        }

        // 3. Mengambil jadwal dari API Aladhan
        async function fetchJadwal(cityName) {
            scheduleBody.innerHTML = '<tr><td colspan="7" class="message loading">Mengambil jadwal puasa...</td></tr>';

            // Menghapus kata "KABUPATEN" atau "KOTA" agar API Aladhan lebih mudah membaca lokasinya
            const cleanCityName = cityName.replace(/^(KOTA |KABUPATEN )/i, '');
            const url = `https://api.aladhan.com/v1/hijriCalendarByCity/1447/9?city=${cleanCityName}&country=Indonesia&method=20`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.code !== 200) throw new Error("Data tidak ditemukan");
                
                const days = data.data;
                let tableHTML = '';

                days.forEach(day => {
                    const date = day.date.gregorian.date; 
                    const timings = day.timings;
                    const cleanTime = (timeStr) => timeStr.split(' ')[0]; // Membuang zona waktu (WIB/WITA/WIT)

                    tableHTML += `<tr>
                        <td>${date}</td>
                        <td>${cleanTime(timings.Imsak)}</td>
                        <td>${cleanTime(timings.Fajr)}</td>
                        <td>${cleanTime(timings.Dhuhr)}</td>
                        <td>${cleanTime(timings.Asr)}</td>
                        <td><strong>${cleanTime(timings.Maghrib)}</strong></td>
                        <td>${cleanTime(timings.Isha)}</td>
                    </tr>`;
                });

                scheduleBody.innerHTML = tableHTML;

            } catch (error) {
                scheduleBody.innerHTML = '<tr><td colspan="7" style="color:red; text-align:center; padding:20px;">Gagal memuat jadwal untuk kota ini. Coba kota terdekat.</td></tr>';
            }
        }

        // Event Listeners
        provinsiSelect.addEventListener('change', (e) => {
            const provinceId = e.target.value;
            if (provinceId) {
                fetchKota(provinceId);
                scheduleBody.innerHTML = '<tr><td colspan="7" class="message">Silakan pilih kota/kabupaten.</td></tr>';
            } else {
                kotaSelect.innerHTML = '<option value="">-- Pilih Provinsi Dahulu --</option>';
                kotaSelect.disabled = true;
            }
        });

        kotaSelect.addEventListener('change', (e) => {
            const cityName = e.target.value;
            if (cityName) {
                fetchJadwal(cityName);
            }
        });

        // Muat provinsi saat halaman pertama kali dibuka
        fetchProvinsi();
    </script>
</body>
</html>
